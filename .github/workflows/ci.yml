name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        run: swift test
      - name: Install Pretext golden dependencies
        run: npm --prefix Tools/pretext-golden ci
      - name: Pretext golden smoke
        run: npm --prefix Tools/pretext-golden test
